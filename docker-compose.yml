services:
  mysql:
    image: mysql:8
    container_name: jetstock_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jetstock
      MYSQL_USER: jetstock_user
      MYSQL_PASSWORD: jetstock_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  backend:
    build: ./server
    container_name: jetstock_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    depends_on:
      - mysql

  frontend:
    build: ./client
    container_name: jetstock_frontend
    restart: always
    ports:
      - "3001:80"
    depends_on: 
      - backend

  storefront:
    build: ./jet-store
    container_name: jetstock_storefront
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - backend

volumes:
  mysql_data: